      { "id": "ohih-0001", "cat": "OHIH", "text": "Apa tujuan utama pelaksanaan Ready/Fit to Work Self-Assessment sebelum mulai bekerja<br>A. Memenuhi administrasi Perusahaan<br>B. Menentukan jadwal kerja karyawan<br>C. Menilai kesiapan kesehatan pekerja sebelum bekerja<br>D. Menggantikan pemeriksaan MCU tahunan", "ans": "c" },
